services:
  - type: web
    name: toshkent-1-iiv-smartcampus
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: toshkent-iiv-campus-db
          property: connectionString
databases:
  - name: toshkent-iiv-campus-db
    databaseName: toshkent_iiv_campus_db
    user: toshkent_iiv_campus_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    ipAllowList: []

